services:
  # https://github.com/MHSanaei/3x-ui/releases
  3x-ui:
    image: ghcr.io/mhsanaei/3x-ui:v3.8.5
    container_name: 3x-ui
    restart: always
    network_mode: host
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_ADMIN
      - NET_RAW
    environment:
      XUI_DB_TYPE: sqlite
      XUI_ENABLE_FAIL2BAN: false # Only for internal access
      XUI_LOG_LEVEL: info
      TZ: ${TZ:?}
    volumes:
      - ./db:/etc/x-ui
      - ./cert:/root/cert
    labels:
      glance.name: 3X-UI
      glance.icon: di:3xui.png
      glance.url: https://3x-ui.${ROOT_DOMAIN:?}
      glance.category: admin

      wud.watch: true
      wud.watch.digest: true
      wud.tag.include: ^v?\d+\.\d+\.\d+$$
      wud.link.template: https://github.com/MHSanaei/3x-ui/releases
