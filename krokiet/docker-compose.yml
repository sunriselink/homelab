services:
  init:
    image: localhost/homelab-init:v2
    pull_policy: never
    entrypoint: create-dirs
    environment:
      NAS_UID: ${NAS_UID:?}
      NAS_GID: ${NAS_GID:?}
    volumes:
      - ${PATH_TO_MEDIA:?}:/tmp/media
    command:
      - /tmp/media
      - /tmp/media/downloads

  # https://github.com/jlesage/docker-krokiet/releases
  # https://github.com/qarmin/czkawka/releases
  krokiet:
    image: ghcr.io/jlesage/krokiet:v26.09.2
    container_name: krokiet
    restart: always
    security_opt:
      - no-new-privileges:true
    environment:
      USER_ID: ${NAS_UID:?}
      GROUP_ID: ${NAS_GID:?}
      DARK_MODE: 1
      WEB_AUDIO: 1
      TZ: ${TZ:?}
    volumes:
      - ./config:/config
      - ${PATH_TO_MEDIA:?}/downloads:/storage/downloads
    tmpfs:
      - /storage
    labels:
      glance.icon: di:krokiet
      glance.url: https://krokiet.${ROOT_DOMAIN:?}
      glance.category: media_management

      traefik.enable: true
      traefik.http.routers.krokiet.middlewares: authelia@file

      wud.watch: true
      wud.watch.digest: true
      wud.tag.include: ^v?\d+\.\d+\.\d+$$
      wud.link.template: https://github.com/jlesage/docker-krokiet/releases
    depends_on:
      init:
        condition: service_completed_successfully

networks:
  default:
    name: krokiet
    driver_opts:
      com.docker.network.bridge.name: br-krokiet
