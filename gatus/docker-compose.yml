services:
  # https://github.com/TwiN/gatus/releases
  gatus:
    image: ghcr.io/twin/gatus:v5.36.0
    container_name: gatus
    restart: always
    user: ${NAS_UID:?}:${NAS_GID:?}
    networks:
      - apprise
      - glance
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      APPRISE_CONFIG_KEY: ${APPRISE_CONFIG_KEY:?}
      APPRISE_TAG: ${APPRISE_TAG:?}
      GATUS_CONFIG_PATH: /config
      GATUS_LOG_LEVEL: INFO
      ROOT_DOMAIN: ${ROOT_DOMAIN:?}
      TZ: ${TZ:?}
    volumes:
      - ./config:/config:ro
    labels:
      glance.icon: di:gatus
      glance.url: https://gatus.${ROOT_DOMAIN:?}
      glance.category: monitoring

      traefik.enable: true
      traefik.http.routers.gatus.middlewares: authelia@file

      wud.watch: true
      wud.watch.digest: true
      wud.tag.include: ^v?\d+\.\d+\.\d+$$
      wud.link.template: https://github.com/TwiN/gatus/releases

networks:
  apprise:
    name: apprise_gatus
    external: true

  glance:
    name: gatus_glance
    driver_opts:
      com.docker.network.bridge.name: br-gatus_glance
