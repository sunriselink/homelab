# https://github.com/linuxserver/docker-socket-proxy/releases
x-common-options: &common-opts
  image: ghcr.io/linuxserver/socket-proxy:3.4.7
  restart: always
  read_only: true
  volumes:
    - /var/run/docker.sock:/var/run/docker.sock:ro
  tmpfs:
    - /run
  labels:
    wud.watch: true
    wud.watch.digest: true
    wud.tag.include: ^v?\d+\.\d+\.\d+$$
    wud.link.template: https://github.com/linuxserver/docker-socket-proxy/releases

x-common-environment: &common-env
  LOG_LEVEL: warning
  ALLOW_LOGS: 1
  CONTAINERS: 1
  INFO: 1
  IMAGES: 1
  PING: 1
  VERSION: 1

services:
  readonly-docker-socket:
    <<: *common-opts
    container_name: readonly-docker-socket
    networks:
      - dozzle
      - glance
      - wud
    ports:
      - 127.0.0.1:36301:2375
    environment:
      <<: *common-env

  admin-docker-socket:
    <<: *common-opts
    container_name: admin-docker-socket
    networks:
      - dockge
    environment:
      <<: *common-env
      BUILD: 1
      NETWORKS: 1
      SERVICES: 1
      POST: 1
      VOLUMES: 1

networks:
  dockge:
    name: docker-admin_dockge
    driver_opts:
      com.docker.network.bridge.name: br-sock_dockge

  dozzle:
    name: docker-readonly_dozzle
    driver_opts:
      com.docker.network.bridge.name: br-sock_dozzle

  glance:
    name: docker-readonly_glance
    driver_opts:
      com.docker.network.bridge.name: br-sock_glance

  wud:
    name: docker-readonly_wud
    driver_opts:
      com.docker.network.bridge.name: br-sock_wud
