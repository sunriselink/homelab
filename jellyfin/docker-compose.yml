services:
  init:
    image: localhost/homelab-init:v2
    pull_policy: never
    entrypoint: create-dirs
    environment:
      NAS_UID: ${NAS_UID:?}
      NAS_GID: ${NAS_GID:?}
    volumes:
      - ${PATH_TO_MEDIA:?}:/tmp/media
    command:
      - /tmp/media
      - /tmp/media/movies
      - /tmp/media/tv

  # https://github.com/linuxserver/docker-jellyfin/releases
  # https://github.com/jellyfin/jellyfin/releases
  jellyfin:
    image: ghcr.io/linuxserver/jellyfin:12.2ubu2604-ls55
    container_name: jellyfin
    restart: always
    environment:
      PUID: ${NAS_UID:?}
      PGID: ${NAS_GID:?}
      TZ: ${TZ:?}
      DOCKER_MODS: linuxserver/mods:jellyfin-opencl-intel
    volumes:
      - ./config:/config
      - ./modcache:/modcache
      - ${PATH_TO_MEDIA:?}:/data
    devices:
      - /dev/dri:/dev/dri
    labels:
      glance.icon: di:jellyfin
      glance.url: https://jellyfin.${ROOT_DOMAIN:?}
      glance.category: media

      traefik.enable: true

      wud.watch: true
      wud.watch.digest: true
      wud.tag.include: ^\d+(?:\.\d+)*ubu\d+\-ls\d+$$
      wud.tag.transform: ^(\d+(?:\.\d+)*)ubu\d+\-ls(\d+)$$ => $$1-$$2
      wud.link.template: https://github.com/jellyfin/jellyfin/releases
      wud.trigger.apprise.notify.enabled: true
    depends_on:
      init:
        condition: service_completed_successfully

networks:
  default:
    name: jellyfin
    driver_opts:
      com.docker.network.bridge.name: br-jellyfin
