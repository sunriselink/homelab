services:
  init:
    image: localhost/homelab-init:v2
    pull_policy: never
    entrypoint: create-dirs
    environment:
      NAS_UID: ${NAS_UID:?}
      NAS_GID: ${NAS_GID:?}
    volumes:
      - ./:/tmp/immich
      - ${PATH_TO_FILES:?}:/tmp/files
    command:
      - /tmp/immich/thumbs
      - /tmp/immich/ml
      - /tmp/immich/ml/cache
      - /tmp/immich/ml/config
      - /tmp/immich/ml/models
      - /tmp/immich/postgres
      - /tmp/immich/redis
      - /tmp/files
      - /tmp/files/immich
      - /tmp/files/immich-ext

  # https://github.com/immich-app/immich/releases
  immich:
    image: ghcr.io/immich-app/immich-server:v3.0.2
    container_name: immich
    restart: always
    user: ${NAS_UID:?}:${NAS_GID:?}
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - NET_RAW
    group_add:
      - ${RENDER_GID:?}
    environment:
      IMMICH_LOG_LEVEL: log # verbose, debug, log, warn, error
      IMMICH_LOG_FORMAT: json
      DB_HOSTNAME: immich-db
      DB_DATABASE_NAME: ${DB_DATABASE_NAME:?}
      DB_USERNAME: ${DB_USERNAME:?}
      DB_PASSWORD: ${DB_PASSWORD:?}
      REDIS_HOSTNAME: immich-redis
      TZ: ${TZ:?}
    volumes:
      - ${PATH_TO_FILES:?}/immich:/data
      - ${PATH_TO_FILES:?}/immich-ext:/mnt/media/immich-ext:ro
      - ./thumbs:/data/thumbs
    devices:
      - /dev/dri:/dev/dri
    labels:
      glance.icon: di:immich
      glance.url: https://immich.${ROOT_DOMAIN:?}
      glance.category: media

      traefik.enable: true

      wud.watch: true
      wud.watch.digest: true
      wud.tag.include: ^v?\d+\.\d+\.\d+$$
    depends_on:
      init:
        condition: service_completed_successfully
      immich-machine-learning:
        condition: service_healthy
      immich-redis:
        condition: service_healthy
      immich-db:
        condition: service_healthy

  immich-machine-learning:
    image: ghcr.io/immich-app/immich-machine-learning:v3.0.2-openvino
    container_name: immich_ml
    restart: always
    user: ${NAS_UID:?}:${NAS_GID:?}
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - NET_RAW
    group_add:
      - ${RENDER_GID:?}
    environment:
      MACHINE_LEARNING_CACHE_FOLDER: /models
      TZ: ${TZ:?}
    volumes:
      - ./ml/cache:/.cache
      - ./ml/config:/.config
      - ./ml/models:/models
    devices:
      - /dev/dri:/dev/dri
    labels:
      wud.watch: true
      wud.watch.digest: true
      wud.tag.include: ^v?\d+\.\d+\.\d+\-openvino$$
    depends_on:
      init:
        condition: service_completed_successfully

  immich-redis:
    image: docker.io/valkey/valkey:9@sha256:4963247afc4cd33c7d3b2d2816b9f7f8eeebab148d29056c2ca4d7cbc966f2d9
    container_name: immich_redis
    restart: always
    user: ${NAS_UID:?}:${NAS_GID:?}
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - NET_RAW
    environment:
      TZ: ${TZ:?}
    volumes:
      - ./redis:/data
    depends_on:
      init:
        condition: service_completed_successfully
    healthcheck:
      test: redis-cli ping || exit 1

  immich-db:
    image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0@sha256:bcf63357191b76a916ae5eb93464d65c07511da41e3bf7a8416db519b40b1c23
    container_name: immich_db
    restart: always
    user: ${NAS_UID:?}:${NAS_GID:?}
    shm_size: 128mb
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - NET_RAW
    environment:
      POSTGRES_USER: ${DB_USERNAME:?}
      POSTGRES_DB: ${DB_DATABASE_NAME:?}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?}
      POSTGRES_INITDB_ARGS: --data-checksums
      TZ: ${TZ:?}
    volumes:
      - ./postgres:/var/lib/postgresql/data
    depends_on:
      init:
        condition: service_completed_successfully

networks:
  default:
    name: immich
    driver_opts:
      com.docker.network.bridge.name: br-immich
